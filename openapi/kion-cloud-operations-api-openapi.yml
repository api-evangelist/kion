components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Kion App API Key. Generate in Kion under your user profile settings.
        Use in the Authorization header as: Bearer YOUR_API_KEY
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource in Kion
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 50
  responses:
    Unauthorized:
      description: Authentication failed or API key is missing/invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Not found
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          description: Internal Kion account ID
        name:
          type: string
          description: Account name
        account_number:
          type: string
          description: Cloud provider account number or ID
        account_type_id:
          type: integer
          description: Account type identifier
        payer_id:
          type: integer
          description: Payer account ID
        project_id:
          type: integer
          description: Project ID the account belongs to
        email:
          type: string
          description: Email associated with the account
        linked_account_number:
          type: string
          description: Linked account number
        linked_role:
          type: string
          description: IAM role used for linked access
        start_datecode:
          type: string
          description: Start date for the account
        skip_access_checking:
          type: boolean
          description: Whether to skip access checking
        use_org_account_access_role:
          type: boolean
          description: Whether to use organization account access role
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels associated with the account
        created_at:
          type: string
          format: date-time
    AccountCreate:
      type: object
      required:
        - name
        - account_number
        - account_type_id
        - payer_id
        - project_id
      properties:
        name:
          type: string
        account_number:
          type: string
        account_type_id:
          type: integer
        payer_id:
          type: integer
        project_id:
          type: integer
        email:
          type: string
        linked_role:
          type: string
        start_datecode:
          type: string
        skip_access_checking:
          type: boolean
        use_org_account_access_role:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        linked_role:
          type: string
        start_datecode:
          type: string
        skip_access_checking:
          type: boolean
        use_org_account_access_role:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        ou_id:
          type: integer
          description: Organizational unit ID
