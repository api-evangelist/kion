openapi: 3.1.0
info:
  title: Kion Cloud Operations Accounts Cloud Rules API
  description: The Kion Public API provides programmatic access to manage cloud operations, governance, compliance, and financial management across AWS, Azure, GCP, and OCI. Kion is a self-hosted cloud operations platform that consolidates account provisioning, access management, compliance enforcement, and FinOps into a single interface. The API uses Bearer token authentication via Kion App API Keys and is accessible at the /api/v3/ path of your Kion instance.
  version: 3.10.0
  contact:
    name: Kion Support
    url: https://support.kion.io
  license:
    name: Proprietary
    url: https://kion.io/why-kion/pricing-and-licensing/
servers:
- url: https://{kion-instance}/api/v3
  description: Kion Instance API Server
  variables:
    kion-instance:
      default: your-kion-instance.example.com
      description: Your Kion deployment hostname
security:
- bearerAuth: []
tags:
- name: Cloud Rules
  description: Manage cloud rules that enforce policies on cloud accounts
paths:
  /cloud-rule:
    get:
      operationId: listCloudRules
      summary: Kion List cloud rules
      description: Returns a list of all cloud rules.
      tags:
      - Cloud Rules
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCloudRule
      summary: Kion Create a cloud rule
      description: Creates a new cloud rule.
      tags:
      - Cloud Rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudRuleCreate'
      responses:
        '201':
          description: Cloud rule created
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud-rule/{id}:
    get:
      operationId: getCloudRule
      summary: Kion Get a cloud rule
      description: Returns details for a specific cloud rule.
      tags:
      - Cloud Rules
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/CloudRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCloudRule
      summary: Kion Update a cloud rule
      description: Updates an existing cloud rule.
      tags:
      - Cloud Rules
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudRuleUpdate'
      responses:
        '200':
          description: Cloud rule updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCloudRule
      summary: Kion Delete a cloud rule
      description: Deletes a cloud rule.
      tags:
      - Cloud Rules
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Cloud rule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Unauthorized:
      description: Authentication failed or API key is missing/invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Not found
  schemas:
    CloudRuleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        pre_webhook_id:
          type: integer
        post_webhook_id:
          type: integer
        aws_iam_policies:
          type: array
          items:
            type: integer
        aws_cloudformation_templates:
          type: array
          items:
            type: integer
        azure_arm_template_definitions:
          type: array
          items:
            type: integer
        azure_policy_definitions:
          type: array
          items:
            type: integer
        azure_role_definitions:
          type: array
          items:
            type: integer
        compliance_standards:
          type: array
          items:
            type: integer
        gcp_iam_roles:
          type: array
          items:
            type: integer
        ous:
          type: array
          items:
            type: integer
        projects:
          type: array
          items:
            type: integer
        service_control_policies:
          type: array
          items:
            type: integer
        labels:
          type: object
          additionalProperties:
            type: string
    CloudRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        pre_webhook_id:
          type: integer
        post_webhook_id:
          type: integer
        built_in:
          type: boolean
        owner_users:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        owner_user_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        aws_iam_policies:
          type: array
          items:
            type: integer
        aws_cloudformation_templates:
          type: array
          items:
            type: integer
        azure_arm_template_definitions:
          type: array
          items:
            type: integer
        azure_policy_definitions:
          type: array
          items:
            type: integer
        azure_role_definitions:
          type: array
          items:
            type: integer
        compliance_standards:
          type: array
          items:
            type: integer
        gcp_iam_roles:
          type: array
          items:
            type: integer
        internal_aws_amis:
          type: array
          items:
            type: integer
        internal_aws_service_catalog_portfolios:
          type: array
          items:
            type: integer
        ous:
          type: array
          items:
            type: integer
        projects:
          type: array
          items:
            type: integer
        service_control_policies:
          type: array
          items:
            type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    CloudRuleCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        pre_webhook_id:
          type: integer
        post_webhook_id:
          type: integer
        aws_iam_policies:
          type: array
          items:
            type: integer
        aws_cloudformation_templates:
          type: array
          items:
            type: integer
        azure_arm_template_definitions:
          type: array
          items:
            type: integer
        azure_policy_definitions:
          type: array
          items:
            type: integer
        azure_role_definitions:
          type: array
          items:
            type: integer
        compliance_standards:
          type: array
          items:
            type: integer
        gcp_iam_roles:
          type: array
          items:
            type: integer
        ous:
          type: array
          items:
            type: integer
        projects:
          type: array
          items:
            type: integer
        service_control_policies:
          type: array
          items:
            type: integer
        labels:
          type: object
          additionalProperties:
            type: string
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource in Kion
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Kion App API Key. Generate in Kion under your user profile settings. Use in the Authorization header as: Bearer YOUR_API_KEY'
