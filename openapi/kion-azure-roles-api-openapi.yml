openapi: 3.1.0
info:
  title: Kion Cloud Operations Accounts Azure Roles API
  description: The Kion Public API provides programmatic access to manage cloud operations, governance, compliance, and financial management across AWS, Azure, GCP, and OCI. Kion is a self-hosted cloud operations platform that consolidates account provisioning, access management, compliance enforcement, and FinOps into a single interface. The API uses Bearer token authentication via Kion App API Keys and is accessible at the /api/v3/ path of your Kion instance.
  version: 3.10.0
  contact:
    name: Kion Support
    url: https://support.kion.io
  license:
    name: Proprietary
    url: https://kion.io/why-kion/pricing-and-licensing/
servers:
- url: https://{kion-instance}/api/v3
  description: Kion Instance API Server
  variables:
    kion-instance:
      default: your-kion-instance.example.com
      description: Your Kion deployment hostname
security:
- bearerAuth: []
tags:
- name: Azure Roles
  description: Manage Azure roles
paths:
  /azure-role:
    get:
      operationId: listAzureRoles
      summary: Kion List Azure roles
      description: Returns a list of all Azure roles.
      tags:
      - Azure Roles
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AzureRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAzureRole
      summary: Kion Create an Azure role
      tags:
      - Azure Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureRoleCreate'
      responses:
        '201':
          description: Role created
        '401':
          $ref: '#/components/responses/Unauthorized'
  /azure-role/{id}:
    get:
      operationId: getAzureRole
      summary: Kion Get an Azure role
      tags:
      - Azure Roles
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAzureRole
      summary: Kion Update an Azure role
      tags:
      - Azure Roles
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureRoleUpdate'
      responses:
        '200':
          description: Role updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAzureRole
      summary: Kion Delete an Azure role
      tags:
      - Azure Roles
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Role deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Unauthorized:
      description: Authentication failed or API key is missing/invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Not found
  schemas:
    AzureRoleCreate:
      type: object
      required:
      - name
      - role_permissions
      properties:
        name:
          type: string
        description:
          type: string
        role_permissions:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    AzureRoleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        role_permissions:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    AzureRole:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        role_permissions:
          type: string
        built_in:
          type: boolean
        owner_users:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        owner_user_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource in Kion
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Kion App API Key. Generate in Kion under your user profile settings. Use in the Authorization header as: Bearer YOUR_API_KEY'
