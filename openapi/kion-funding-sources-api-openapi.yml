openapi: 3.1.0
info:
  title: Kion Cloud Operations Accounts Funding Sources API
  description: The Kion Public API provides programmatic access to manage cloud operations, governance, compliance, and financial management across AWS, Azure, GCP, and OCI. Kion is a self-hosted cloud operations platform that consolidates account provisioning, access management, compliance enforcement, and FinOps into a single interface. The API uses Bearer token authentication via Kion App API Keys and is accessible at the /api/v3/ path of your Kion instance.
  version: 3.10.0
  contact:
    name: Kion Support
    url: https://support.kion.io
  license:
    name: Proprietary
    url: https://kion.io/why-kion/pricing-and-licensing/
servers:
- url: https://{kion-instance}/api/v3
  description: Kion Instance API Server
  variables:
    kion-instance:
      default: your-kion-instance.example.com
      description: Your Kion deployment hostname
security:
- bearerAuth: []
tags:
- name: Funding Sources
  description: Manage funding sources for tracking and allocating cloud spend
paths:
  /funding-source:
    get:
      operationId: listFundingSources
      summary: Kion List funding sources
      description: Returns a list of all funding sources.
      tags:
      - Funding Sources
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createFundingSource
      summary: Kion Create a funding source
      description: Creates a new funding source.
      tags:
      - Funding Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundingSourceCreate'
      responses:
        '201':
          description: Funding source created
        '401':
          $ref: '#/components/responses/Unauthorized'
  /funding-source/{id}:
    get:
      operationId: getFundingSource
      summary: Kion Get a funding source
      description: Returns details for a specific funding source.
      tags:
      - Funding Sources
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/FundingSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateFundingSource
      summary: Kion Update a funding source
      description: Updates an existing funding source.
      tags:
      - Funding Sources
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundingSourceUpdate'
      responses:
        '200':
          description: Funding source updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFundingSource
      summary: Kion Delete a funding source
      description: Deletes a funding source.
      tags:
      - Funding Sources
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Funding source deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    FundingSourceUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        start_datecode:
          type: string
        end_datecode:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    FundingSourceCreate:
      type: object
      required:
      - name
      - amount
      - start_datecode
      - end_datecode
      - ou_id
      properties:
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        start_datecode:
          type: string
        end_datecode:
          type: string
        ou_id:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
    FundingSource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        start_datecode:
          type: string
        end_datecode:
          type: string
        ou_id:
          type: integer
        owner_users:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        owner_user_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Authentication failed or API key is missing/invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Not found
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource in Kion
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Kion App API Key. Generate in Kion under your user profile settings. Use in the Authorization header as: Bearer YOUR_API_KEY'
