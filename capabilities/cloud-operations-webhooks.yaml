        destructive: false
        idempotent: false
      call: cloud-operations-webhooks.createwebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: kion-get-webhook
      description: Kion Get a webhook
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-operations-webhooks.getwebhook
      outputParameters:
      - type: object
        mapping: $.
    - name: kion-update-webhook
      description: Kion Update a webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cloud-operations-webhooks.updatewebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: kion-delete-webhook
      description: Kion Delete a webhook
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-operations-webhooks.deletewebhook
      outputParameters:
      - type: object
        mapping: $.
