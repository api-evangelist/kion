        idempotent: true
      call: cloud-operations-labels.updatelabel
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: kion-delete-label
      description: Kion Delete a label
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-operations-labels.deletelabel
      outputParameters:
