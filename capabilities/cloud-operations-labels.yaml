    baseUri: https://{kion-instance}/api/v3
    description: Kion Cloud Operations API — Labels business capability. Self-contained, no shared references.
    resources:
    - name: label
      path: /label
      operations:
      - name: listlabels
        method: GET
        description: Kion List labels
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createlabel
        method: POST
        description: Kion Create a label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: label-id
      path: /label/{id}
      operations:
      - name: getlabel
        method: GET
        description: Kion Get a label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatelabel
        method: PATCH
        description: Kion Update a label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletelabel
        method: DELETE
        description: Kion Delete a label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.KION_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-operations-labels-rest
    port: 8080
    description: REST adapter for Kion Cloud Operations API — Labels. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/label
      name: label
      description: REST surface for label.
      operations:
      - method: GET
        name: listlabels
        description: Kion List labels
        call: cloud-operations-labels.listlabels
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createlabel
        description: Kion Create a label
        call: cloud-operations-labels.createlabel
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/label/{id}
      name: label-id
      description: REST surface for label-id.
      operations:
      - method: GET
        name: getlabel
        description: Kion Get a label
        call: cloud-operations-labels.getlabel
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatelabel
        description: Kion Update a label
        call: cloud-operations-labels.updatelabel
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletelabel
        description: Kion Delete a label
        call: cloud-operations-labels.deletelabel
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-operations-labels-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kion Cloud Operations API — Labels. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: kion-list-labels
      description: Kion List labels
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-operations-labels.listlabels
      outputParameters:
      - type: object
        mapping: $.
